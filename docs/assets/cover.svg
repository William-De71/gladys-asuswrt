<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the ASUSWRT integration for Gladys Assistant (illustration,
       not the ASUS logo). Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1622"/>
      <stop offset="1" stop-color="#16263a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3647"/>
      <stop offset="1" stop-color="#151c27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00a3e0"/>
      <stop offset="1" stop-color="#5ad1ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fb6ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2fb6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="534" fill="url(#bg)"/>

  <!-- faint network grid -->
  <g stroke="#1f3046" stroke-width="1">
    <path d="M0 89 H800 M0 178 H800 M0 267 H800 M0 356 H800 M0 445 H800"/>
    <path d="M100 0 V534 M200 0 V534 M300 0 V534 M400 0 V534 M500 0 V534 M600 0 V534 M700 0 V534"/>
  </g>

  <!-- internet globe, left -->
  <g transform="translate(110 175)" fill="none" stroke="#7fb3ff" stroke-width="5">
    <circle r="44" fill="#14243c"/>
    <ellipse rx="18" ry="44"/>
    <path d="M-44 0 H44 M-38 -22 H38 M-38 22 H38"/>
  </g>
  <text x="110" y="250" fill="#7fb3ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" text-anchor="middle">Internet</text>

  <!-- links -->
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <path d="M158 178 C 230 178, 250 262, 300 262" stroke="#7fb3ff"/>
    <path d="M500 250 C 570 250, 580 160, 640 160" stroke="#58c98b" stroke-dasharray="2 14"/>
    <path d="M500 280 C 570 280, 580 380, 640 380" stroke="#58c98b" stroke-dasharray="2 14"/>
  </g>

  <!-- the router -->
  <circle cx="400" cy="250" r="165" fill="url(#glow)"/>
  <g stroke="#3f4d63" stroke-width="10" stroke-linecap="round">
    <path d="M325 228 L305 120"/>
    <path d="M375 222 L368 100"/>
    <path d="M425 222 L432 100"/>
    <path d="M475 228 L495 120"/>
  </g>
  <path d="M300 230 L500 230 L520 300 L280 300 Z" fill="url(#body)" stroke="#4b5a72" stroke-width="3" stroke-linejoin="round"/>
  <path d="M330 272 H470" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <g fill="#58c98b">
    <circle cx="345" cy="252" r="4"/>
    <circle cx="362" cy="252" r="4"/>
    <circle cx="379" cy="252" r="4"/>
    <circle cx="396" cy="252" r="4" fill="#5ad1ff"/>
  </g>
  <!-- Wi-Fi waves above -->
  <g fill="none" stroke="#5ad1ff" stroke-width="6" stroke-linecap="round">
    <path d="M370 72 A42 42 0 0 1 430 72"/>
    <path d="M352 52 A68 68 0 0 1 448 52" stroke-opacity="0.7"/>
    <path d="M334 32 A94 94 0 0 1 466 32" stroke-opacity="0.4"/>
  </g>

  <!-- the home (Gladys), right top -->
  <g transform="translate(690 160)">
    <path d="M-44 4 L0 -36 L44 4" fill="none" stroke="#58c98b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-32" y="0" width="64" height="44" rx="6" fill="#1b3a2e" stroke="#58c98b" stroke-width="5"/>
    <rect x="-9" y="18" width="18" height="26" rx="3" fill="#58c98b"/>
  </g>
  <!-- phones and laptop on the network, right bottom -->
  <g transform="translate(690 380)" fill="#1b3a2e" stroke="#58c98b" stroke-width="5">
    <rect x="-46" y="-26" width="52" height="36" rx="5"/>
    <rect x="18" y="-34" width="28" height="50" rx="6"/>
    <path d="M-30 22 h20" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="400" y="420" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle">ASUSWRT</text>
  <text x="400" y="466" fill="#c8d3e3" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" text-anchor="middle">for Gladys Assistant</text>
  <text x="400" y="506" fill="#7d8ba0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle">ASUS routers · stock firmware and Asuswrt-Merlin</text>
</svg>
